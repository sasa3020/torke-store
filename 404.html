<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./" />
    <title>Redirecting...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      var path = window.location.pathname;
      var repo = path.split('/')[1] || '';
      // Redirect to home with path retained in hash if needed
      window.location.replace(window.location.origin + '/' + (repo ? repo + '/' : '') + '#' + window.location.pathname.replace('/' + repo, ''));
    </script>
  </head>
  <body>
    <p>جاري التحويل للصفحة الرئيسية... <a href="./">اضغط هنا إذا لم يتم التحويل تلقائياً</a></p>
  </body>
</html>
